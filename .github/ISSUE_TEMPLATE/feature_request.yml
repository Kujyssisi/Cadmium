name: Feature request
description: Something Cadmium should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: >
        The thing you are trying to get done, not the feature you have in mind
        for it. A described problem gets a better answer than a described
        solution, and sometimes an answer that already exists.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you think should happen
      description: >
        How it would work where you would use it — which panel, which menu,
        what a click does.
    validations:
      required: true

  - type: textarea
    id: prior
    attributes:
      label: How other software does it
      description: >
        If another DAW has this, say which and what it gets right or wrong
        about it. Not a requirement; it just saves guessing.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the open issues and this is not one of them.
          required: true
